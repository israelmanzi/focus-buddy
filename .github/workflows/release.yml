name: release

# Builds the Android APK, the Linux desktop packages and the sync server jar.
# Push a tag (v0.1.0) to publish them as a GitHub release; run manually for artifacts only.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # Optional signing key: set BUDDY_KEYSTORE_BASE64 (and passwords) as repository secrets.
      # Without it the APK is debug-signed and installable, but not updateable over a release key.
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.BUDDY_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.BUDDY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BUDDY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.BUDDY_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            {
              echo "BUDDY_KEYSTORE=$RUNNER_TEMP/release.keystore"
              echo "BUDDY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "BUDDY_KEY_ALIAS=${KEY_ALIAS:-focus-buddy}"
              echo "BUDDY_KEY_PASSWORD=${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            } >> "$GITHUB_ENV"
          fi
      - name: Build APK
        run: ./gradlew --no-daemon :composeApp:assembleRelease
      - name: Rename
        run: cp composeApp/build/outputs/apk/release/composeApp-release.apk "focus-buddy.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: focus-buddy.apk

  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # jpackage needs rpmbuild for RPMs; the Temurin JDK has the jmods Fedora's package lacks.
      - name: Install packaging tools
        run: sudo apt-get update && sudo apt-get install -y rpm fakeroot
      - name: Build desktop packages
        run: ./gradlew --no-daemon :composeApp:packageRpm :composeApp:packageDeb :composeApp:packageUberJarForCurrentOS
      - name: Collect
        run: |
          mkdir -p dist
          cp composeApp/build/compose/binaries/main/rpm/*.rpm dist/ || true
          cp composeApp/build/compose/binaries/main/deb/*.deb dist/ || true
          cp composeApp/build/compose/jars/focus-buddy-*.jar dist/
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-packages
          path: dist/*

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon :server:test :server:buildFatJar
      - name: Collect
        run: |
          mkdir -p dist
          cp server/build/libs/focus-buddy-server.jar dist/
      - uses: actions/upload-artifact@v4
        with:
          name: sync-server
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, desktop, server]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Checksums
        run: |
          find dist -type f -exec sha256sum {} + > dist/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*
          generate_release_notes: true
